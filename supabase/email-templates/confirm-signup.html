<!--
  Supabase → Authentication → Emails → "Confirm signup"
  Subject: Confirm your Recap account
  Paste this whole file as the message body.
  The link goes to /auth/confirm, which works even when the email is opened on another device.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d1033;padding:40px 16px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#151a45;border-radius:14px;padding:40px 36px;color:#eef0ff;">
        <tr>
          <td style="font-size:20px;font-weight:800;letter-spacing:-0.3px;padding-bottom:32px;">
            <span style="display:inline-block;width:18px;height:8px;background:#ffe45c;border-radius:2px;vertical-align:middle;margin-right:8px;"></span>Recap
          </td>
        </tr>
        <tr>
          <td style="font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-0.5px;padding-bottom:16px;">Confirm your email</td>
        </tr>
        <tr>
          <td style="font-size:16px;line-height:1.6;color:#c9cdf0;padding-bottom:28px;">
            You're one click away from your first recap. Confirm that this is your email address to activate your account.
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:28px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
               style="display:inline-block;background:#ffe45c;color:#1a1400;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px;">
              Confirm my email
            </a>
          </td>
        </tr>
        <tr>
          <td style="font-size:13px;line-height:1.6;color:#9ba1d6;">
            The link works once and expires in 24 hours. If you didn't create a Recap account, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
